name: CI

# The intrinsix golden + unit tests need only base R + testthat (the verified
# classifier / Zhao / clustering paths are pure base R), so CI is fast and pulls
# no Bioconductor. The pipeline runner (pam50_run) is exercised by test-run.R.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  r-package:
    name: intrinsix tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: "4.4"
          use-public-rspm: true

      - name: Install test dependencies
        run: Rscript -e 'install.packages(c("testthat", "withr", "yaml", "argparser"))'

      - name: Install intrinsix
        run: R CMD INSTALL .

      - name: Run golden + unit tests
        run: |
          Rscript -e 'suppressMessages({library(testthat); library(intrinsix)}); \
            test_dir("tests/testthat", stop_on_failure = TRUE)'

      - name: CLI smoke test
        run: |
          pkg=$(Rscript -e 'cat(system.file(package = "intrinsix"))')
          "$pkg/exec/intrinsix" --help
