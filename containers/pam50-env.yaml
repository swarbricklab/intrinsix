name: pam50
# Runtime environment for the `pam50` container. Mirrors workflow/envs/pam50.yaml
# (the conda fallback) plus r-testthat so the image can run the package's test
# suite in CI. R is pinned to 4.5 (required by anndataR for .h5ad input; the port
# was re-verified byte-identical on 4.5). SummarizedExperiment + anndataR provide
# SE / h5ad inputs. The pam50 package is installed on top of this env in the Dockerfile.
channels:
  - conda-forge
  - bioconda
dependencies:
  - r-base=4.5
  - r-yaml
  - r-dplyr
  - r-data.table
  - r-heatmap.plus
  - r-ggplot2
  - r-circlize
  - r-cluster
  - bioconductor-complexheatmap
  - bioconductor-ctc
  - bioconductor-impute
  - bioconductor-summarizedexperiment
  - bioconductor-anndatar
  - bioconductor-rhdf5
  - r-testthat
