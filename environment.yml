# Portable conda environment for the intrinsix package (laptop or HPC; no singularity
# needed). Create it, then install the package on top:
#
#   conda env create -f environment.yml
#   conda activate intrinsix
#   R -e 'remotes::install_local(".")'        # or remotes::install_github("swarbricklab/intrinsix")
#
# A DVC stage can then run:  conda run -n intrinsix intrinsix run --config config.yaml
name: intrinsix
channels:
  - conda-forge
  - bioconda
dependencies:
  - r-base=4.5
  - r-yaml
  - r-argparser
  - r-dplyr
  - r-data.table
  - r-cluster
  - r-ggplot2
  - r-circlize
  - r-heatmap.plus
  - bioconductor-complexheatmap
  - bioconductor-ctc
  - bioconductor-impute
  - bioconductor-summarizedexperiment
  - bioconductor-anndatar
  - bioconductor-rhdf5
  - r-rmarkdown
  - r-knitr
  - r-remotes
