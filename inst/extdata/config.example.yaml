# Example config for `intrinsix run --config config.yaml` (and pam50_run()).
#
# The input is two tables: an expression matrix (genes x samples, log2-scale
# normalised, HGNC symbols) and a sample sheet. Copy this file, edit the paths,
# and run. Schema: inst/extdata/config.schema.yaml.

# -- Inputs -- #
inputs:
  # Expression: a TSV matrix (genes x samples, HGNC symbols, log2-scale), OR a
  # path to an .h5ad file (needs anndataR, R >= 4.5).
  expression: "expression.tsv"
  # For .h5ad / SummarizedExperiment inputs, which layer/assay to use:
  # layer: "log2_uqn"
  # For .h5ad / SummarizedExperiment inputs, a var/rowData column of gene symbols
  # (when the row index is Ensembl IDs):
  # gene_col: "gene_name"
  # Drift-proof PAM50 selection: a var/rowData column holding the classifier pcrID
  # for the 50 PAM50 genes (precomputed upstream from stable Ensembl IDs). When set,
  # PAM50 genes are selected by these IDs, not by matching HGNC symbols:
  # pam50_id_col: "pam50_symbol"
  # Or, fully self-contained + stable: a var/rowData column of NCBI Entrez IDs,
  # which intrinsix maps to the classifier pcrID via its own bundled annotation
  # (no precomputed PAM50 columns needed upstream):
  # entrez_col: "entrez_id"
  # Sample sheet (TSV). Optional for .h5ad input (taken from obs if omitted).
  samples: "samples.tsv"
  # Column in `samples` holding the sample IDs (must match expression columns).
  sample_id_column: "sample_id"
  # Optional: carry only these sample-metadata columns (from obs/colData or the
  # `samples` sheet) into pam50_calls.tsv. Omit to carry all metadata columns.
  # metadata_columns: ["tissue_id", "donor_id", "clinical_subtype"]

# -- Sample selection -- #
# Default: no filter => PAM50 is called on ALL samples.
filter:
  column: null          # e.g. "is_pam50_eligible"; null = use all samples
  include: []           # keep rows whose `column` value is in this set

# Optional replicate deduplication (keep one sample per group).
deduplicate:
  by: null              # e.g. "tissue_id"; null = no deduplication
  keep: "first"         # lowest sample id lexically within each group
  selections: {}        # overrides, e.g. {"3563": "WTS_3563_T0_S6"}

# -- Normalisation -- #
# Zhao4 subtype-specific quantile centering. Requires a clinical (ER x HER2)
# subtype column whose values match the SIGMA table columns. Disable for the
# "all samples, no subtype" case (classifier median-centering is used instead).
zhao_normalization:
  enabled: true
  subtype_column: "clinical_subtype"

# -- Classifier -- #
classifier:
  calibration: -1          # Perou calibrationParameters (-1 = none)
  collapse_method: "mean"  # mean | iqr
  has_clinical: false      # ROR-C needs a T-stage column; keep false unless provided
  prefix: "PAM50scores"
  # Also emit the legacy Perou-format "<prefix>_pam50scores.txt" (quoted, unnamed
  # first column) for Perou Lab scripts. Default false => only the clean
  # pam50_calls.tsv is written.
  legacy_perou_scores: false

# -- Intrinsic clustering / claudin-low -- #
intrinsic_clustering:
  enabled: true

# -- Outputs -- #
outs:
  output_dir: "results/intrinsix"
