$schema: "http://json-schema.org/draft-07/schema#"
description: PAM50 workflow configuration
type: object
properties:
  inputs:
    type: object
    properties:
      expression:
        type: string
        description: Path to the expression matrix (genes x samples, log2-scale).
      samples:
        type: string
        description: Path to the sample sheet (one row per sample).
      sample_id_column:
        type: string
        description: Column in `samples` holding sample IDs matching expression columns.
      layer:
        type: string
        description: For .h5ad/SummarizedExperiment inputs, the layer/assay to use.
      gene_col:
        type: string
        description: >-
          For .h5ad/SummarizedExperiment inputs, a var/rowData column holding gene
          symbols to use as row names (e.g. "gene_name" when the index is Ensembl IDs).
      pam50_id_col:
        type: string
        description: >-
          For .h5ad/SummarizedExperiment inputs, a var/rowData column holding the
          classifier pcrID for the 50 PAM50 genes (empty otherwise), precomputed
          upstream from a stable ID (e.g. Ensembl). When set, PAM50 genes are
          selected via these IDs instead of by matching drifting HGNC symbols.
      entrez_col:
        type: string
        description: >-
          For .h5ad/SummarizedExperiment inputs, a var/rowData column of NCBI Entrez
          gene IDs. intrinsix maps these to the classifier pcrID via its bundled
          annotation (stable, self-contained — needs no precomputed PAM50 columns).
          Used when pam50_id_col is not set.
      metadata_columns:
        type: array
        items:
          type: string
        description: >-
          Allowlist of sample-metadata columns (from obs/colData, or the `samples`
          sheet) to carry into pam50_calls.tsv. Omit to carry all metadata columns.
    required: [expression, sample_id_column]
  filter:
    type: object
    properties:
      column:
        type: ["string", "null"]
        description: Column to filter samples on; null uses all samples.
      include:
        type: array
        description: Keep rows whose `column` value is in this set.
    required: [column]
  deduplicate:
    type: object
    properties:
      by:
        type: ["string", "null"]
      keep:
        type: string
        enum: ["first"]
      selections:
        type: object
    required: [by]
  zhao_normalization:
    type: object
    properties:
      enabled:
        type: boolean
      subtype_column:
        type: ["string", "null"]
        description: Required when enabled; values must match SIGMA table columns.
    required: [enabled]
  classifier:
    type: object
    properties:
      calibration:
        type: integer
      collapse_method:
        type: string
        enum: ["mean", "iqr"]
      has_clinical:
        type: boolean
      prefix:
        type: string
      legacy_perou_scores:
        type: boolean
        description: >-
          Also emit the legacy Perou-format "<prefix>_pam50scores.txt" (quoted
          cells, unnamed first column, duplicate Her2) for downstream Perou Lab
          scripts that expect it. Default false.
    required: [calibration, collapse_method, has_clinical, prefix]
  intrinsic_clustering:
    type: object
    properties:
      enabled:
        type: boolean
    required: [enabled]
  outs:
    type: object
    properties:
      output_dir:
        type: string
    required: [output_dir]
required: [inputs, filter, zhao_normalization, classifier, intrinsic_clustering, outs]
