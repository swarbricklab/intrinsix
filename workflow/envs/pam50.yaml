name: pam50
# Conda fallback for platforms without singularity. The `pam50` container is the
# primary runtime (see config.containers.pam50); this env reproduces it. The
# pam50 package itself is installed on top of this env
# (R CMD INSTALL .).
channels:
  - conda-forge
  - bioconda
dependencies:
  - r-base>=4.1
  - r-yaml
  - r-dplyr
  - r-data.table
  - r-heatmap.plus
  - r-ggplot2
  - r-circlize
  - r-cluster
  - bioconductor-complexheatmap
  - bioconductor-ctc
  - bioconductor-impute
